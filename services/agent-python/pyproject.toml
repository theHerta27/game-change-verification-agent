[project]
name = "game-change-verification-agent"
version = "0.1.0"
description = "Bounded AI agent workflow for cross-engine game change verification"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "matplotlib>=3.8",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "workflow*", "gameconfig_agent*", "agent_service*"]
exclude = ["tests*", "examples*", "real_llm_smoke_cases*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
